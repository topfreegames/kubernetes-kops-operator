name: Go

on:
  push:
    tags:
      - '*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: [self-hosted, arch:amd64]
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Run lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest
        args: --timeout 10m0s

  tests:
    runs-on: [self-hosted, arch:amd64]
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install make -y

    - name: Run tests
      run: make test-ci

  docker-build-amd64:
    runs-on: [self-hosted, arch:amd64]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
    - tests
    - lint

    permissions:
      packages: write
      contents: read

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: tfgco/${{ github.event.repository.name }}
        tags: |
          type=ref,event=tag,suffix=-amd64
          type=semver,pattern={{version}},suffix=-amd64
          type=semver,pattern={{major}}.{{minor}},suffix=-amd64

    - name: Build and Push AMD64 Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=amd64
        cache-to: type=gha,mode=max,scope=amd64
        provenance: false
        sbom: false

  docker-build-arm64:
    runs-on: [self-hosted, arch:arm64]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
    - tests
    - lint

    permissions:
      packages: write
      contents: read

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: tfgco/${{ github.event.repository.name }}
        tags: |
          type=ref,event=tag,suffix=-arm64
          type=semver,pattern={{version}},suffix=-arm64
          type=semver,pattern={{major}}.{{minor}},suffix=-arm64

    - name: Build and Push ARM64 Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=arm64
        cache-to: type=gha,mode=max,scope=arm64
        provenance: false
        sbom: false

  docker-manifest:
    runs-on: [self-hosted, arch:amd64]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs:
    - docker-build-amd64
    - docker-build-arm64

    permissions:
      packages: write
      contents: read

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata for multi-arch manifest
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: tfgco/${{ github.event.repository.name }}
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Create and push multi-arch manifest
      run: |
        REPO_NAME="tfgco/${{ github.event.repository.name }}"
        
        TAGS="${{ steps.meta.outputs.tags }}"
        
        echo "$TAGS" | while read -r TAG; do
          if [ -n "$TAG" ]; then
            echo "Creating manifest for $TAG"
            docker manifest create $TAG \
              ${TAG}-amd64 \
              ${TAG}-arm64
            
            docker manifest annotate $TAG ${TAG}-amd64 --arch amd64
            docker manifest annotate $TAG ${TAG}-arm64 --arch arm64

            docker manifest push $TAG
          fi
        done

  publish-crds:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    needs:
    - tests
    - lint

    permissions:
      contents: write

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install make -y

    - name: Generate combined CRD manifest
      run: |
        make manifests
        bin/kustomize build config/crd > crds.yaml

    - name: Upload CRDs as build artifact
      uses: actions/upload-artifact@v4
      with:
        name: crds
        path: crds.yaml
        if-no-files-found: error

    - name: Attach CRDs to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: crds.yaml

  verify-manifests:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout repo
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install make -y

    - name: Verify generated manifests and CRDs are up to date
      run: |
        make manifests generate
        if ! git diff --exit-code; then
          echo "::error::Generated manifests/CRDs/deepcopy are out of date. Run 'make manifests generate' locally and commit the result."
          exit 1
        fi
